name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # RUSTFLAGS=-D warnings on the test jobs closes the rustc half of the
  # warning gate; this job closes the clippy half, in both variants.
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  # Includes the repo-wide neutrality check (crates/makinax/tests/neutrality.rs).
  test-readwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"

  test-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --no-default-features --no-fail-fast
        env:
          RUSTFLAGS: "-D warnings"
          CARGO_INCREMENTAL: "0"

  # makinax standalone, per feature combination. The workspace build unifies
  # features (`write` always comes with `tenderly`), so a cfg mismatch that
  # breaks one combination for a module user is invisible to every other job.
  makinax-feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: makinax and makinax-mcp, per feature set
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -e
          cargo check -p makinax --all-targets --no-default-features
          cargo check -p makinax --all-targets --no-default-features --features write
          cargo check -p makinax --all-targets --no-default-features --features quote
          cargo check -p makinax --all-targets --no-default-features --features write,tenderly
          cargo check -p makinax --all-targets --all-features
          cargo check -p makinax-mcp --all-targets --no-default-features
          cargo check -p makinax-mcp --all-targets

  # Release creation tolerates only an existing release, and release.yml
  # creates both releases through that script.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-gh-release-create.sh

  # Every makinax item the server uses is exercised by a makinax-level test.
  makinax-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/makinax-coverage.sh

  # The read-only binary links no signing or write code. The script builds it
  # into its own target dir, so it never scans a stale or read-write artifact.
  # The script's own markers are pinned by crates/makinax-mcp/tests/readonly_assert.rs.
  assert-readonly-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/assert-readonly.sh
      # The reverse check: every marker IS linked into the read-write build,
      # so a marker that stopped existing cannot keep the check above green.
      - name: Every marker is in the read-write binary
        run: |
          cargo build -p makinax-mcp --bin makinax-mcp --release --target-dir target/readwrite-assert
          scripts/assert-readonly.sh --live target/readwrite-assert/release/makinax-mcp

  # The ignored tests that need foundry. A missing anvil fails here rather
  # than skipping green.
  findings-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Linking the workspace's alloy-heavy debug binaries exhausted the
      # default runner disk and crashed the linker ("ld terminated with signal
      # 7 [Bus error]") twice. Preinstalled toolchains no job here uses are the
      # cheapest thing to drop.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      # The Executor against a LOCAL anvil: a refusing pre-send hook leaves
      # the chain untouched, and a prepared request is sent exactly as given
      # (nonce, gas, fees not re-filled).
      - run: cargo test -p makinax --test exec -- --ignored
      # One module walked end to end on an anvil fork of Base, through
      # `makinax::ext` alone. Forks Base's public RPC at a pinned block;
      # MAKINAX_FORK_RPC overrides the source and MAKINAX_FORK_BLOCK the block.
      # CI is set here, so an unreachable source fails this step.
      - run: cargo test -p makinax --test fork_walk -- --ignored --nocapture
