[workspace]
members = ["crates/makinax", "crates/makinax-mcp"]
resolver = "3"

# `line-tables-only` keeps file and line in panics and backtraces, which is all
# the test suite reads, and drops the type and variable debug info nothing here
# uses. `unpacked` skips the dsymutil step on macOS.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
strip = true
